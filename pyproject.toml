[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "time_recorder"
version = "0.1.0"
authors = [
  { name="S. Gooding", email="sgooding@gmail.com" },
]
description = "A simple pyqt app to record timestamps and add a description"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/sgooding/time_recorder"